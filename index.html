<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encyclocartes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Encyclocartes">
<meta name="theme-color" content="#1f4535">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Spectral:ital,wght@0,500;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#2c5a47; --felt-deep:#1f4535; --felt-line:rgba(241,234,214,.16);
  --ink:#f1ead6; --muted:#bccabb;
  --paper:#fbf8ef; --paper-ink:#1d2421; --paper-muted:#5c6660;
  --brass:#e0b04a; --brass-ink:#2a2006; --bad:#e0745c; --good:#7fd19c;
  --panel:rgba(0,0,0,.18);
  --r0:#8e9a94; --r1:#3f9a63; --r2:#3a7be0; --r3:#9a55e6; --r4:#f0a823;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --felt:#142c24; --felt-deep:#0d1f19; --felt-line:rgba(236,228,207,.12);
    --ink:#ece4cf; --muted:#9fb0a4; --paper:#efe9da; --panel:rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --felt:#142c24; --felt-deep:#0d1f19; --felt-line:rgba(236,228,207,.12);
  --ink:#ece4cf; --muted:#9fb0a4; --paper:#efe9da; --panel:rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);background-color:var(--felt);
  background-image:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.07),transparent 60%),
    repeating-linear-gradient(45deg,rgba(0,0,0,.035) 0 2px,transparent 2px 5px);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

header{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;background:var(--felt-deep);border-bottom:1px solid var(--felt-line);
}
.brand{font-family:Spectral,Georgia,serif;font-style:italic;font-weight:600;font-size:1.35rem}
.purse{display:flex;align-items:center;gap:6px;background:var(--brass);color:var(--brass-ink);font-weight:800;border-radius:999px;padding:5px 12px;font-variant-numeric:tabular-nums}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h2{font-family:Spectral,Georgia,serif;font-weight:700;font-size:1.6rem;margin:4px 0}
.sub{color:var(--muted);margin:0 0 18px;line-height:1.45;max-width:60ch}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:var(--felt-deep);border-top:1px solid var(--felt-line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:var(--muted);padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8rem;font-weight:600}
nav button span{font-size:1.35rem;line-height:1}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"]::after{content:"";width:22px;height:3px;border-radius:2px;background:var(--brass);margin-top:3px}

.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:1rem;background:var(--ink);color:var(--felt-deep)}
.btn.gold{background:var(--brass);color:var(--brass-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--felt-line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

/* ===== Pack ===== */
.pack-hero{position:relative;width:min(190px,48vw);aspect-ratio:5/7;margin:6px auto 22px;border:0;padding:0;background:none}
.pack{position:absolute;inset:0;z-index:60;animation:float 3.2s ease-in-out infinite;touch-action:none;user-select:none;-webkit-user-select:none}
.pack.loading{animation:wobble .45s ease-in-out infinite}
.pack.nudge{animation:wobble .4s ease-in-out 1}
.pack.torn{animation:none}
.pack-top,.pack-body{
  position:absolute;left:0;right:0;overflow:hidden;
  background-image:
    radial-gradient(circle at 50% 46%,rgba(255,220,140,.35),transparent 42%),
    linear-gradient(158deg,#f1cf7a 0%,#b9862a 16%,#2f6b52 38%,#173b2f 66%,#3f8a69 88%,#e0b04a 100%);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.6);
}
.pack-top{top:0;height:14%;border-radius:10px 10px 2px 2px;background-size:100% 714.3%;background-position:top;transition:transform .75s cubic-bezier(.25,.7,.3,1),opacity .75s;z-index:2}
.pack-top::before{content:"";position:absolute;left:0;right:0;top:0;height:60%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 2px,rgba(0,0,0,.18) 2px 5px)}
.pack-body{top:14%;bottom:0;border-radius:2px 2px 10px 10px;background-size:100% 116.3%;background-position:bottom;transition:transform .8s cubic-bezier(.55,0,.75,.35),opacity .8s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;container-type:inline-size;text-align:center;color:#fff6dc}
.pack-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0 2px,rgba(0,0,0,.2) 2px 5px)}
.pack .emb{width:44cqw;height:44cqw;border-radius:50%;border:2cqw solid #f1cf7a;display:grid;place-items:center;font-family:Spectral,Georgia,serif;font-style:italic;font-weight:600;font-size:28cqw;color:#f1cf7a;background:rgba(10,30,22,.55);box-shadow:0 0 6cqw rgba(241,207,122,.35)}
.pack .pt{font-family:Spectral,Georgia,serif;font-style:italic;font-weight:700;font-size:12cqw;text-shadow:0 1cqw 2cqw rgba(0,0,0,.4)}
.pack .ps{font-weight:700;font-size:6.5cqw}
.pack .ps2{font-size:5.5cqw;opacity:.85}
.pack .shine{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:10px;mix-blend-mode:overlay;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.8) 45%,rgba(160,230,255,.5) 52%,transparent 66%);background-size:300% 100%;animation:sheen 3.6s linear infinite}
.cutline{position:absolute;left:5%;right:5%;top:14%;z-index:4;border-top:2px dashed rgba(255,255,255,.65)}
.cutline i{position:absolute;left:0;top:-3px;height:4px;width:0;border-radius:2px;background:#fff;box-shadow:0 0 10px 2px #fff}
.pack-top.off{transform:translate(65%,-160%) rotate(32deg);opacity:0}
.pack-body.drop{transform:translateY(125%);opacity:0}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}

/* ===== Overlay d'ouverture ===== */
.po{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:radial-gradient(ellipse at 50% 42%,#2f6450 0%,#0a1712 72%);
  padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden;touch-action:manipulation}
.po[hidden]{display:none}
.po-stage{position:relative;width:min(250px,62vw);aspect-ratio:5/7}
.po-stage.wide{width:min(600px,94vw);aspect-ratio:auto}
.po-hint{margin:0;min-height:2.6em;text-align:center;font-weight:600;line-height:1.3;max-width:30ch}
.po-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.po-actions[hidden]{display:none}
.po-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--ink);font-size:1.1rem}
.po-x[hidden]{display:none}

.stack{position:absolute;inset:0;z-index:50;cursor:pointer}
.scard{position:absolute;inset:0;perspective:1100px;transform:translateY(22%) scale(.86);opacity:0;transition:transform .6s cubic-bezier(.25,.8,.3,1),opacity .5s}
.stack.in .scard{opacity:1;transform:translateY(calc(var(--k) * -5px)) rotate(calc(var(--k) * -1.6deg))}
.stack.in .scard.gone{transform:translate(-150%,-6%) rotate(-20deg);opacity:0}
.scard .inner{position:absolute;inset:0;transition:transform .75s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d}
.scard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.face.front .card{height:100%}
.scard.top.g2 .cardback{animation:glow 1.4s ease-in-out infinite;--gc:var(--r2)}
.scard.top.g3 .cardback{animation:glow 1s ease-in-out infinite;--gc:var(--r3)}
.scard.top.g4 .cardback{animation:glow .7s ease-in-out infinite;--gc:var(--r4)}
.scard.charge .inner{animation:charge .7s ease-in}
@keyframes glow{0%,100%{box-shadow:0 0 14px 2px var(--gc)}50%{box-shadow:0 0 40px 12px var(--gc)}}
@keyframes charge{0%{transform:scale(1)}20%{transform:scale(1.03) rotate(-2deg)}40%{transform:scale(1.05) rotate(2deg)}60%{transform:scale(1.07) rotate(-2deg)}80%{transform:scale(1.09) rotate(2deg)}100%{transform:scale(1.1)}}
.new-tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:5;background:var(--brass);color:var(--brass-ink);font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s .5s;pointer-events:none}
.scard.flipped .new-tag,.new-tag.on{opacity:1}
.spark{position:fixed;z-index:120;width:9px;height:9px;margin:-4px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);pointer-events:none;animation:spark .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
.flash{position:fixed;inset:0;z-index:110;pointer-events:none;background:radial-gradient(circle at 50% 45%,#fff 0%,var(--c) 30%,transparent 70%);animation:flash .9s ease-out forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.sum-c{position:relative;animation:pop .45s cubic-bezier(.3,1.4,.5,1) backwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* ===== Carte ===== */
.card{
  --rc:var(--r0);container-type:inline-size;position:relative;width:100%;aspect-ratio:5/7;
  background:var(--paper);color:var(--paper-ink);border-radius:9px;border:3px solid var(--rc);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 2px 0 rgba(0,0,0,.25),0 10px 20px -8px rgba(0,0,0,.45);
}
.card.t1{--rc:var(--r1)} .card.t2{--rc:var(--r2)} .card.t3{--rc:var(--r3)} .card.t4{--rc:var(--r4)}
.card .ph{position:relative;height:57%;flex:none;background:hsl(var(--hue) 32% 78%);overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:Spectral,Georgia,serif;font-weight:700;font-size:40cqw;color:hsla(var(--hue),40%,22%,.45)}
.card .rb{position:absolute;left:0;bottom:0;z-index:1;background:var(--rc);color:#fff;font-weight:700;font-size:6.2cqw;padding:1.6cqw 4cqw;border-top-right-radius:4cqw}
.card .name{font-family:Spectral,Georgia,serif;font-weight:700;font-size:8.6cqw;line-height:1.08;padding:3cqw 4cqw 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .desc{flex:1;font-size:5.6cqw;line-height:1.25;color:var(--paper-muted);padding:1.2cqw 4cqw 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .stats{display:flex;gap:4cqw;align-items:center;padding:1.5cqw 4cqw 3cqw;font-weight:800;font-size:6.4cqw;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .stats .v{margin-left:auto;font-weight:600;color:var(--paper-muted)}
.card.t4::after,.card.t3::after{
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;z-index:2;
  background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.8) 42%,rgba(255,200,90,.6) 48%,rgba(140,220,255,.6) 54%,transparent 68%);
  background-size:260% 260%;animation:holo 3.2s linear infinite;
}
.card.t3::after{opacity:.5;animation-duration:4.5s}
@keyframes holo{from{background-position:130% 0}to{background-position:-130% 0}}
.cardback{width:100%;height:100%;border-radius:9px;border:3px solid #c9b98f;background:var(--felt-deep);
  background-image:repeating-linear-gradient(45deg,rgba(224,176,74,.15) 0 6px,transparent 6px 12px);
  display:grid;place-items:center;container-type:inline-size;box-shadow:0 10px 24px -8px rgba(0,0,0,.6)}
.cardback span{font-family:Spectral,Georgia,serif;font-style:italic;font-weight:600;color:var(--brass);font-size:32cqw;border:1.2cqw solid var(--brass);border-radius:50%;width:52cqw;height:52cqw;display:grid;place-items:center;background:var(--felt-deep)}

/* ===== Boosters ===== */
.packs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:20px}
.opt{background:var(--panel);border:1px solid var(--felt-line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.opt h3{margin:0;font-size:1.05rem}
.opt p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.4}
.opt .btn{margin-top:auto}
.odds{display:flex;gap:6px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.odds li{font-size:.8rem;padding:4px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--felt-line)}
.odds li b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ===== Collection ===== */
.progress{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px}
.progress strong{font-family:Spectral,Georgia,serif;font-size:2.2rem;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.chip{border:1px solid var(--felt-line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--felt-deep);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:14px 12px}
.pick{position:relative;border:0;padding:0;background:none;text-align:left;border-radius:10px}
.count{position:absolute;bottom:-7px;right:-5px;z-index:3;background:var(--ink);color:var(--felt-deep);font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 7px}
.pick.sel .card{outline:3px solid var(--brass);outline-offset:3px}
.pick .order{position:absolute;top:-8px;left:-6px;z-index:3;width:24px;height:24px;border-radius:50%;background:var(--brass);color:var(--brass-ink);font-weight:800;display:grid;place-items:center;font-size:.85rem}
.empty{background:var(--panel);border:1px dashed var(--felt-line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);line-height:1.5}
.foot{margin-top:30px;display:flex;justify-content:center}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.88rem;padding:8px}

.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;background:rgba(5,15,11,.75)}
.modal[hidden]{display:none}
.sheet{background:var(--felt-deep);border:1px solid var(--felt-line);border-radius:16px;padding:20px;width:min(440px,100%);max-height:calc(100% - 20px);overflow:auto}
.sheet .big{width:min(230px,64vw);margin:0 auto 16px}
.sheet p{line-height:1.5;margin:0 0 12px}
.sheet .meta{color:var(--muted);font-size:.9rem}
.sheet a{color:var(--brass);font-weight:600}

/* ===== Duel ===== */
.sticky-cta{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));margin-top:18px;display:flex;justify-content:center}
.sticky-cta .btn{box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:240px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.hp{font-size:.86rem;font-weight:700}
.hp .lbl{display:flex;justify-content:space-between;margin-bottom:5px;gap:6px}
.hp .lbl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp .track{height:10px;background:var(--panel);border-radius:5px;overflow:hidden}
.hp .fill{height:100%;background:var(--good);border-radius:5px;transition:width .5s}
.hp.foe .fill{background:var(--bad)}
.round-lbl{text-align:center;color:var(--muted);font-weight:600;margin:0 0 12px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;max-width:420px;margin:0 auto 16px}
.vs{font-family:Spectral,Georgia,serif;font-style:italic;font-size:1.3rem;color:var(--brass)}
.who{text-align:center;font-size:.8rem;color:var(--muted);margin-top:6px;font-weight:600}
.quiz{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:16px}
.quiz h3{font-size:.95rem;margin:0 0 8px;color:var(--paper-muted)}
.quiz blockquote{font-family:Spectral,Georgia,serif;font-size:1.08rem;line-height:1.45;margin:0 0 12px}
.timer{height:5px;background:rgba(0,0,0,.1);border-radius:3px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:var(--paper-ink);width:100%}
.answers{display:grid;gap:8px}
.answers button{text-align:left;border:2px solid rgba(0,0,0,.12);background:#fff;color:var(--paper-ink);border-radius:10px;padding:12px 14px;font-weight:600}
.answers button.right{border-color:#2f8f55;background:#dff3e6}
.answers button.wrong{border-color:#b9472f;background:#f8e0da}
.answers button:disabled{cursor:default}
.result{margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.1);line-height:1.5}
.end{text-align:center;padding:16px 0}
.end .big-word{font-family:Spectral,Georgia,serif;font-weight:700;font-size:3rem;margin:4px 0}
.end p{color:var(--muted);margin:0 0 20px}
.loading-box{text-align:center;padding:50px 0;color:var(--muted)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:130;background:var(--ink);color:var(--felt-deep);font-weight:700;padding:10px 16px;border-radius:999px;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  .sum{grid-template-columns:repeat(5,1fr)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  .pack,.pack.loading,.pack .shine,.card.t4::after,.card.t3::after,.scard .cardback{animation:none!important}
  .scard,.scard .inner,.pack-top,.pack-body{transition-duration:.01s}
}
</style>
</head>
<body>
<header>
  <div class="brand">Encyclocartes</div>
  <div class="purse" aria-label="Plumes"><span aria-hidden="true">🪶</span><span id="plumes">0</span></div>
</header>

<main>
  <section id="v-boosters"></section>
  <section id="v-collection" hidden></section>
  <section id="v-duel" hidden></section>
</main>

<nav aria-label="Navigation">
  <button data-tab="boosters" aria-current="page"><span aria-hidden="true">🎴</span>Boosters</button>
  <button data-tab="collection"><span aria-hidden="true">📚</span>Collection</button>
  <button data-tab="duel"><span aria-hidden="true">⚔️</span>Duel</button>
</nav>

<div class="po" id="po" hidden>
  <button class="po-x" id="poClose" data-act="po-close" aria-label="Fermer" hidden>✕</button>
  <div class="po-stage" id="poStage"></div>
  <p class="po-hint" id="poHint"></p>
  <div class="po-actions" id="poActions" hidden></div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= Config ================= */
const API = "https://fr.wikipedia.org/api/rest_v1";
const KEY = "encyclocartes-v2", FREE_MS = 10*60*1000, PACK_PRICE = 200, HP_MAX = 250;
// Rareté selon les vues réelles des 30 derniers jours
const T = [
  {i:0,name:"Commune",min:0,sell:15},
  {i:1,name:"Peu commune",min:3000,sell:40},
  {i:2,name:"Rare",min:20000,sell:100},
  {i:3,name:"Épique",min:80000,sell:250},
  {i:4,name:"Légendaire",min:250000,sell:600},
];
const FAMOUS = ["France","Paris","Napoléon_Ier","Seconde_Guerre_mondiale","Kylian_Mbappé","Emmanuel_Macron","Victor_Hugo","Albert_Einstein","Louis_XIV","Tour_Eiffel","Première_Guerre_mondiale","Charles_de_Gaulle","Zinédine_Zidane","Lionel_Messi","Cristiano_Ronaldo","Union_européenne","Molière","Jeanne_d'Arc","Révolution_française","Marie_Curie","Lune","Système_solaire","Michael_Jackson","ChatGPT","Minecraft","Titanic","Léonard_de_Vinci","La_Joconde","Pyramide_de_Khéops","Château_de_Versailles","Everest","24_Heures_du_Mans","Valorant","Clash_of_Clans","Baguette","Le_Petit_Prince","Jules_Verne","Tour_de_France","Platon","Mont-Saint-Michel","Ornithorynque","Axolotl","Tardigrada","Rubik's_Cube","Pétanque","Kraken","Pierre_de_Rosette","Dronte_de_Maurice","Aurore_polaire","Piton_de_la_Fournaise","Jupiter_(planète)","Soleil","Mars_(planète)","Tyrannosaurus","Lion","Chat","Requin_blanc","Rome","Londres","New_York","Tokyo","Empire_romain","Jules_César","Cléopâtre_VII","Alexandre_le_Grand","Wolfgang_Amadeus_Mozart","Ludwig_van_Beethoven","Pablo_Picasso","Vincent_van_Gogh","Isaac_Newton","Charles_Darwin","Elvis_Presley","The_Beatles","Johnny_Hallyday","Édith_Piaf","Star_Wars","Harry_Potter","One_Piece","Pokémon","Fortnite","Grand_Theft_Auto_V","Colisée","Statue_de_la_Liberté","Grande_Muraille","Machu_Picchu","Taj_Mahal","Big_Ben","Notre-Dame_de_Paris","Coupe_du_monde_de_football","Jeux_olympiques"];

/* ================= État ================= */
const defaults = () => ({plumes:300,cards:{},bonus:3,nextFree:0,wins:0,losses:0,draws:0});
let S;
try{const raw=localStorage.getItem(KEY);S=raw?Object.assign(defaults(),JSON.parse(raw)):defaults();}catch(e){S=defaults();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let tab="boosters", filter="all", resetArmed=false, packBusy=false;
let D={phase:"select",sel:[]};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= Utilitaires ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const tierOf=v=>{let t=T[0];for(const x of T)if(v>=x.min)t=x;return t;};
const fmt=v=>v>=1e6?(v/1e6).toFixed(1).replace(".",",")+" M":v>=1e4?Math.round(v/1e3)+" k":v>=1e3?(v/1e3).toFixed(1).replace(".",",")+" k":String(v);
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);}
function syncPurse(){$("#plumes").textContent=S.plumes;}

/* ================= Wikipédia ================= */
async function getJSON(u){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
  try{const r=await fetch(u,{signal:ac.signal,cache:"no-store"});if(!r.ok)throw new Error(r.status);return await r.json();}
  finally{clearTimeout(tm);}
}
const apiTitle=s=>s.titles?.canonical||s.title;
const dispTitle=s=>s.titles?.normalized||String(s.title).replace(/_/g," ");
const okPage=s=>s&&s.type==="standard"&&!/^(Spécial|Wikipédia|Portail|Fichier|Catégorie|Aide|Modèle):/.test(apiTitle(s));
const summary=t=>getJSON(`${API}/page/summary/${encodeURIComponent(t.replace(/ /g,"_"))}`);
const randomSummary=()=>getJSON(`${API}/page/random/summary?r=${Math.random()}`);
const ymd=d=>d.toISOString().slice(0,10).replace(/-/g,"");
async function views30(title){
  const end=new Date(Date.now()-864e5),start=new Date(Date.now()-30*864e5);
  const u=`https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/fr.wikipedia/all-access/user/${encodeURIComponent(title.replace(/ /g,"_"))}/daily/${ymd(start)}00/${ymd(end)}00`;
  try{const j=await getJSON(u);return (j.items||[]).reduce((a,i)=>a+(i.views||0),0);}catch(e){return 0;}
}
let MOSTREAD=null;
async function mostRead(){
  if(MOSTREAD)return MOSTREAD;
  for(const back of [1,2]){
    const d=new Date(Date.now()-back*864e5);
    const y=d.getUTCFullYear(),m=String(d.getUTCMonth()+1).padStart(2,"0"),dd=String(d.getUTCDate()).padStart(2,"0");
    try{
      const j=await getJSON(`${API}/feed/featured/${y}/${m}/${dd}`);
      const list=(j.mostread?.articles||[]).filter(okPage);
      if(list.length){MOSTREAD=list;return list;}
    }catch(e){}
  }
  MOSTREAD=[];return MOSTREAD;
}
function toCard(s,views){
  const title=dispTitle(s),t=tierOf(views),h=hash(title);
  const base=Math.round(14+Math.log10(views+10)*18);
  return {id:title,api:apiTitle(s),title,img:s.thumbnail?.source||"",desc:s.description||"",
    extract:(s.extract||"").slice(0,700),url:s.content_urls?.desktop?.page||`https://fr.wikipedia.org/wiki/${encodeURIComponent(apiTitle(s))}`,
    views,ti:t.i,atk:base+(h%15)-7,def:base+((h>>>8)%15)-7,hue:h%360};
}
async function fetchSlot(src,mr){
  let source=src;
  for(let tries=0;tries<4;tries++){
    try{
      let s=null;
      if(source==="trend"&&mr.length) s=pick(mr);
      else if(source==="famous") s=await summary(pick(FAMOUS));
      else{
        const rs=await Promise.all([randomSummary(),randomSummary(),randomSummary()]);
        s=rs.find(x=>okPage(x)&&x.thumbnail)||rs.find(okPage);
      }
      if(okPage(s))return s;
    }catch(e){}
    source=tries===0?"famous":"random";
  }
  return null;
}
async function buildPack(){
  const mr=await mostRead();
  const slots=[...Array(5)].map(()=>{const r=Math.random();return r<.45?"random":r<.8?"trend":"famous";});
  const got=await Promise.all(slots.map(s=>fetchSlot(s,mr)));
  const seen=new Set(),uniq=[];
  for(const s of got){if(!s)continue;const k=dispTitle(s);if(!seen.has(k)){seen.add(k);uniq.push(s);}}
  while(uniq.length<5){const s=await fetchSlot("random",mr);if(!s)break;const k=dispTitle(s);if(!seen.has(k)){seen.add(k);uniq.push(s);}}
  if(uniq.length<3)throw new Error("wiki");
  const cards=await Promise.all(uniq.map(async s=>toCard(s,await views30(apiTitle(s)))));
  return cards.sort((a,b)=>a.views-b.views);
}

/* ================= Rendu carte ================= */
function cardHTML(c){
  return `<div class="card t${c.ti}" style="--hue:${c.hue}">
    <div class="ph">${c.img?`<img src="${esc(c.img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:""}<span class="ini" aria-hidden="true">${esc(c.title[0]||"?")}</span><span class="rb">${T[c.ti].name}</span></div>
    <div class="name">${esc(c.title)}</div>
    <div class="desc">${esc(c.desc||c.extract)}</div>
    <div class="stats"><span title="Attaque">⚔️ ${c.atk}</span><span title="Défense">🛡️ ${c.def}</span><span class="v" title="Vues sur 30 jours">👁 ${fmt(c.views)}</span></div>
  </div>`;
}
const packHTML=live=>`<div class="pack">
  <div class="pack-top"></div>${live?'<div class="cutline"><i id="cut"></i></div>':""}
  <div class="pack-body"><div class="emb">E</div><div class="pt">Encyclocartes</div><div class="ps">Booster de 5 cartes</div><div class="ps2">Articles de Wikipédia</div></div>
  <div class="shine"></div></div>`;
function addCard(c){const ex=S.cards[c.id];if(ex){ex.count++;}else S.cards[c.id]={...c,count:1};}

/* ================= Ouverture de booster ================= */
function freeLeft(){return Math.max(0,S.nextFree-Date.now());}
function bestSource(){return S.bonus>0?"bonus":freeLeft()===0?"free":S.plumes>=PACK_PRICE?"buy":null;}
function openPack(source){
  if(packBusy||!source)return;
  if(source==="bonus"){if(S.bonus<=0)return;S.bonus--;}
  else if(source==="free"){if(freeLeft()>0)return;S.nextFree=Date.now()+FREE_MS;}
  else{if(S.plumes<PACK_PRICE){toast("Pas assez de plumes");return;}S.plumes-=PACK_PRICE;}
  packBusy=true;save();syncPurse();renderBoosters();PO.start(source);
}
function refund(src){if(src==="bonus")S.bonus++;else if(src==="free")S.nextFree=0;else S.plumes+=PACK_PRICE;save();syncPurse();}

const PO={
  hint(t){$("#poHint").textContent=t;},
  start(source){
    Object.assign(this,{source,cards:null,i:0,phase:"pack",ready:false,prog:0,lock:false});
    $("#po").hidden=false;document.body.style.overflow="hidden";
    $("#poActions").hidden=true;$("#poActions").innerHTML="";$("#poClose").hidden=true;
    const st=$("#poStage");st.className="po-stage";st.innerHTML=packHTML(true);
    const pack=st.querySelector(".pack");pack.classList.add("loading");
    this.hint("Préparation du booster…");
    this.bindDrag(pack);
    buildPack().then(cards=>{
      this.cards=cards.map(c=>{const isNew=!S.cards[c.id];addCard(c);return {c,isNew};});
      save();this.ready=true;pack.classList.remove("loading");
      this.hint("Glisse ton doigt sur le haut du paquet pour le déchirer");
    }).catch(()=>{
      refund(this.source);pack.classList.remove("loading");this.phase="failed";
      this.hint("Impossible de joindre Wikipédia. Vérifie ta connexion, ton booster t’a été rendu.");
      $("#poClose").hidden=false;
    });
  },
  bindDrag(pack){
    let sx=null,w=1,moved=false;
    pack.addEventListener("pointerdown",e=>{if(this.phase!=="pack")return;sx=e.clientX;w=pack.getBoundingClientRect().width;moved=false;try{pack.setPointerCapture(e.pointerId);}catch(_){}});
    pack.addEventListener("pointermove",e=>{
      if(sx===null||!this.ready||this.phase!=="pack")return;
      const p=Math.min(1,Math.abs(e.clientX-sx)/(w*.8));
      if(p>.06)moved=true;
      this.prog=Math.max(this.prog,p);$("#cut").style.width=(this.prog*100)+"%";
      if(this.prog>=1){sx=null;this.tear();}
    });
    pack.addEventListener("pointerup",()=>{
      if(sx===null)return;sx=null;
      if(!this.ready){pack.classList.add("nudge");setTimeout(()=>pack.classList.remove("nudge"),420);return;}
      if(!moved||this.prog>.55)this.tear();
      else{this.prog=0;$("#cut").style.width="0";}
    });
    pack.addEventListener("pointercancel",()=>{sx=null;});
  },
  tear(){
    if(this.phase!=="pack"||!this.ready)return;
    this.phase="tearing";
    const st=$("#poStage"),pack=st.querySelector(".pack");
    $("#cut").style.width="100%";pack.classList.add("torn");
    if(navigator.vibrate)navigator.vibrate(25);
    pack.querySelector(".pack-top").classList.add("off");
    const stack=document.createElement("div");stack.className="stack";
    this.cards.forEach((p,i)=>{
      const el=document.createElement("div");
      el.className=`scard g${p.c.ti}`;el.style.zIndex=String(50-i);el.style.setProperty("--k",i);
      el.innerHTML=`<div class="inner"><div class="face"><div class="cardback"><span>E</span></div></div><div class="face front">${cardHTML(p.c)}</div></div>${p.isNew?'<span class="new-tag">Nouvelle</span>':""}`;
      stack.appendChild(el);
    });
    stack.addEventListener("click",()=>this.tapTop());
    st.insertBefore(stack,pack);
    this.hint("");
    setTimeout(()=>pack.querySelector(".pack-body").classList.add("drop"),300);
    requestAnimationFrame(()=>requestAnimationFrame(()=>stack.classList.add("in")));
    setTimeout(()=>{pack.remove();this.phase="reveal";this.markTop();},1050);
  },
  markTop(){
    const els=[...document.querySelectorAll(".scard")];
    els.forEach(e=>e.classList.remove("top"));
    if(els[this.i])els[this.i].classList.add("top");
    this.hint(`Touche la carte pour la révéler (${this.i+1} sur ${this.cards.length})`);
  },
  tapTop(){
    if(this.phase!=="reveal"||this.lock)return;
    const el=document.querySelectorAll(".scard")[this.i];if(!el)return;
    const p=this.cards[this.i];
    if(!el.classList.contains("flipped")){
      this.lock=true;
      const flip=()=>{
        el.classList.remove("top");el.classList.add("flipped");
        if(p.c.ti>=2)setTimeout(()=>fx(p.c.ti),260);
        if(p.c.ti>=3&&navigator.vibrate)navigator.vibrate([40,40,80]);
        this.hint(`${T[p.c.ti].name}${p.isNew?", nouvelle carte !":""} Touche pour continuer`);
        setTimeout(()=>{this.lock=false;},350);
      };
      if(p.c.ti>=3&&!reduced){el.classList.add("charge");setTimeout(()=>{el.classList.remove("charge");flip();},700);}
      else flip();
    }else{
      el.classList.add("gone");this.i++;
      if(this.i>=this.cards.length){this.lock=true;setTimeout(()=>{this.lock=false;this.summary();},420);}
      else this.markTop();
    }
  },
  summary(){
    this.phase="summary";
    const st=$("#poStage");st.className="po-stage wide";
    st.innerHTML=`<div class="sum">${this.cards.slice().reverse().map((p,k)=>`<div class="sum-c" style="animation-delay:${k*70}ms">${p.isNew?'<span class="new-tag on">Nouvelle</span>':""}${cardHTML(p.c)}</div>`).join("")}</div>`;
    const nNew=this.cards.filter(p=>p.isNew).length;
    this.hint(nNew?`${nNew} nouvelle${nNew>1?"s":""} carte${nNew>1?"s":""} dans ta collection`:"Que des doublons, revends-les dans ta collection");
    const next=bestSource();
    $("#poActions").innerHTML=`<button class="btn ghost" data-act="po-close">Fermer</button>${next?`<button class="btn gold" data-act="po-again">${next==="buy"?`Ouvrir un autre (${PACK_PRICE} 🪶)`:"Ouvrir un autre"}</button>`:""}`;
    $("#poActions").hidden=false;
  },
  close(){
    $("#po").hidden=true;document.body.style.overflow="";
    $("#poActions").hidden=true;$("#poStage").innerHTML="";
    this.phase="idle";packBusy=false;renderBoosters();
  }
};
function fx(ti){
  if(reduced)return;
  const col=getComputedStyle(document.documentElement).getPropertyValue(`--r${ti}`).trim();
  const r=$("#poStage").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  if(ti>=3){const f=document.createElement("div");f.className="flash";f.style.setProperty("--c",col);document.body.appendChild(f);setTimeout(()=>f.remove(),950);}
  const n=ti===4?44:ti===3?30:16,reach=ti===4?280:ti===3?210:150;
  for(let k=0;k<n;k++){
    const s=document.createElement("i"),a=Math.random()*Math.PI*2,d=reach*(.45+Math.random()*.55);
    s.className="spark";
    s.style.cssText=`left:${cx}px;top:${cy}px;--c:${col};--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d).toFixed(0)}px;animation-delay:${Math.floor(Math.random()*90)}ms`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),1300);
  }
}

/* ================= Vue Boosters ================= */
function freeLabel(){const ms=freeLeft();if(!ms)return null;const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${m}:${String(s).padStart(2,"0")}`;}
function renderBoosters(){
  const fl=freeLabel(),best=bestSource();
  let h=`<h2>Ouvre des boosters</h2>
  <p class="sub">Chaque carte est un vrai article Wikipédia avec sa photo. Sa rareté dépend du nombre de lectures sur les 30 derniers jours. Certaines cartes viennent des articles les plus lus d’hier.</p>
  <button class="pack-hero" data-act="open" data-src="${best||""}" ${best?"":"disabled"} aria-label="Ouvrir un booster">${packHTML(false)}</button>
  <div class="packs">`;
  if(S.bonus>0)h+=`<div class="opt"><h3>Boosters de bienvenue</h3><p>Il t’en reste ${S.bonus}.</p><button class="btn gold" data-act="open" data-src="bonus">Ouvrir</button></div>`;
  h+=`<div class="opt"><h3>Booster gratuit</h3><p>Un nouveau toutes les 10 minutes.</p>
    <button class="btn ${fl?"ghost":"gold"}" data-act="open" data-src="free" id="free-btn" ${fl?"disabled":""}>${fl?`Prochain dans ${fl}`:"Ouvrir le booster gratuit"}</button></div>
    <div class="opt"><h3>Acheter un booster</h3><p>Gagne des plumes en duel ou en revendant tes doublons.</p>
    <button class="btn" data-act="open" data-src="buy" ${S.plumes<PACK_PRICE?"disabled":""}>Acheter pour ${PACK_PRICE} 🪶</button></div></div>
  <ul class="odds" aria-label="Seuils de rareté">${T.map(t=>`<li><b style="background:var(--r${t.i})"></b>${t.name} ${t.min?`dès ${fmt(t.min)} vues`:"moins de 3 k vues"}</li>`).join("")}</ul>`;
  $("#v-boosters").innerHTML=h;
}
setInterval(()=>{
  if(tab!=="boosters")return;
  const b=$("#free-btn");if(!b)return;
  const fl=freeLabel();
  if(fl)b.textContent=`Prochain dans ${fl}`;else if(b.disabled)renderBoosters();
},1000);

/* ================= Vue Collection ================= */
function myCards(){return Object.values(S.cards).filter(c=>c.count>0);}
function renderCollection(){
  const all=myCards();
  const list=all.filter(c=>filter==="all"||String(c.ti)===filter).sort((a,b)=>b.ti-a.ti||b.views-a.views);
  const total=all.reduce((a,c)=>a+c.count,0);
  let h=`<h2>Ta collection</h2>
  <div class="progress"><strong>${all.length}</strong><span>articles différents, ${total} cartes au total</span></div>
  <div class="chips" role="group" aria-label="Filtrer par rareté">
    <button class="chip" data-filter="all" aria-pressed="${filter==="all"}">Toutes</button>
    ${T.slice().reverse().map(t=>`<button class="chip" data-filter="${t.i}" aria-pressed="${filter===String(t.i)}">${t.name} ${all.filter(c=>c.ti===t.i).length}</button>`).join("")}
  </div>`;
  if(!all.length)h+=`<div class="empty">Ta collection est vide.<br><br><button class="btn gold" data-tab-go="boosters">Ouvrir un booster</button></div>`;
  else if(!list.length)h+=`<div class="empty">Aucune carte de cette rareté pour l’instant.</div>`;
  else h+=`<div class="grid">${list.map(c=>`<button class="pick" data-act="detail" data-id="${esc(c.id)}" aria-label="${esc(c.title)}">${cardHTML(c)}${c.count>1?`<span class="count">×${c.count}</span>`:""}</button>`).join("")}</div>`;
  h+=`<p class="sub" style="margin-top:22px">Duels : ${S.wins} victoire${S.wins>1?"s":""}, ${S.losses} défaite${S.losses>1?"s":""}, ${S.draws} nul${S.draws>1?"s":""}.</p>
  <div class="foot"><button class="linkish" data-act="reset">${resetArmed?"Appuie encore pour tout effacer":"Recommencer une partie"}</button></div>`;
  $("#v-collection").innerHTML=h;
}
function openDetail(id){
  const c=S.cards[id];if(!c)return;const t=T[c.ti];
  $("#sheet").innerHTML=`<div class="big">${cardHTML(c)}</div>
    <p>${esc(c.extract||c.desc)}</p>
    <p class="meta">${fmt(c.views)} vues sur 30 jours au moment où tu l’as obtenue. Tu en as ${c.count}. Un doublon se revend ${t.sell} plumes.</p>
    <p><a href="${esc(c.url)}" target="_blank" rel="noopener">Lire l’article sur Wikipédia</a></p>
    <div class="btn-row">
      <button class="btn gold" data-act="sell" data-id="${esc(id)}" ${c.count>1?"":"disabled"}>${c.count>1?`Vendre un doublon (+${t.sell} 🪶)`:"Aucun doublon à vendre"}</button>
      <button class="btn ghost" data-act="close">Fermer</button>
    </div>`;
  $("#modal").hidden=false;
}
function sellOne(id){
  const c=S.cards[id];if(!c||c.count<=1)return;
  c.count--;S.plumes+=T[c.ti].sell;save();syncPurse();
  toast(`+${T[c.ti].sell} plumes`);openDetail(id);renderCollection();
}

/* ================= Duel ================= */
const FOES=["L’Archiviste","Le Bibliothécaire","La Conservatrice","Le Rédacteur fou","La Correctrice"];
let timerI=null;
function makeQuestion(card,others){
  const ex=card.extract||"";
  const sents=ex.match(/[^.!?]+[.!?]+/g)||(ex?[ex]:[]);
  const yr=sents.map(s=>({s:s.trim(),m:s.match(/\b(1[0-9]{3}|20[0-2][0-9])\b/)})).filter(x=>x.m);
  const pool=[...new Set(others.filter(t=>t&&t!==card.title))];
  const canMask=pool.length>=3&&ex.length>40;
  if(yr.length&&(!canMask||Math.random()<.5)){
    const {s,m}=pick(yr),y=+m[1],set=new Set([y]);
    while(set.size<4){const v=y+(Math.floor(Math.random()*25)+1)*(Math.random()<.5?-1:1);if(v>0&&v<=2026)set.add(v);}
    let txt=s.replace(m[1],"____");if(txt.length>280)txt=txt.slice(0,280)+"…";
    return {head:"Complète l’extrait de l’article",text:txt,opts:shuffle([...set].map(String)),answer:String(y)};
  }
  if(canMask){
    let txt=sents.slice(0,2).join(" ").trim();
    for(const w of card.title.split(/[\s'’\-(),:]+/).filter(w=>w.length>=3))txt=txt.replace(new RegExp(escRe(w),"gi"),"▢▢▢");
    if(txt.length>280)txt=txt.slice(0,280)+"…";
    return {head:"De quel article vient cet extrait ?",text:txt,opts:shuffle([card.title,...shuffle(pool).slice(0,3)]),answer:card.title};
  }
  const b=["Moins de 3 000","De 3 000 à 20 000","De 20 000 à 80 000","Plus de 80 000"];
  const idx=card.views<3000?0:card.views<20000?1:card.views<80000?2:3;
  return {head:"Combien de vues en 30 jours ?",text:card.title,opts:b,answer:b[idx]};
}
async function buildBot(){
  const mr=await mostRead();const picks=shuffle(mr).slice(0,2);
  for(const t of shuffle(FAMOUS)){if(picks.length>=3)break;try{const s=await summary(t);if(okPage(s))picks.push(s);}catch(e){}}
  if(picks.length<3)throw new Error("bot");
  return Promise.all(picks.slice(0,3).map(async s=>toCard(s,await views30(apiTitle(s)))));
}
function renderDuel(){
  const el=$("#v-duel");
  if(D.phase==="select"){
    const owned=myCards().sort((a,b)=>b.ti-a.ti||(b.atk+b.def)-(a.atk+a.def));
    let h=`<h2>Duel de savoir</h2><p class="sub">Choisis 3 cartes. À chaque manche, réponds à une question tirée de l’article de ta carte : bonne réponse, attaque complète ; mauvaise réponse, attaque affaiblie.</p>`;
    if(owned.length<3)h+=`<div class="empty">Il te faut au moins 3 cartes différentes.<br><br><button class="btn gold" data-tab-go="boosters">Ouvrir des boosters</button></div>`;
    else h+=`<div class="grid">${owned.map(c=>{const p=D.sel.indexOf(c.id);return `<button class="pick ${p>-1?"sel":""}" data-act="toggle" data-id="${esc(c.id)}" aria-pressed="${p>-1}">${p>-1?`<span class="order">${p+1}</span>`:""}${cardHTML(c)}</button>`;}).join("")}</div>
      <div class="sticky-cta"><button class="btn gold" data-act="start" ${D.sel.length===3?"":"disabled"}>${D.sel.length===3?"Lancer le duel":`Choisis tes cartes (${D.sel.length}/3)`}</button></div>`;
    el.innerHTML=h;return;
  }
  if(D.phase==="loading"){el.innerHTML=`<div class="loading-box">Recherche d’un adversaire<span class="dots"></span></div>`;return;}
  const hp=(l,v,foe)=>`<div class="hp ${foe?"foe":""}"><div class="lbl"><span>${l}</span><span>${v} PV</span></div><div class="track"><div class="fill" style="width:${v/HP_MAX*100}%"></div></div></div>`;
  const hud=`<div class="hud">${hp("Toi",D.hpMe)}${hp(D.foe,D.hpBot,true)}</div>`;
  if(D.phase==="battle"){
    const me=D.my[D.round],bot=D.bot[D.round],Q=D.qs[D.round],R=D.res;
    let h=hud+`<p class="round-lbl">Manche ${D.round+1} sur 3</p>
      <div class="arena"><div>${cardHTML(me)}<div class="who">Ta carte</div></div><div class="vs">contre</div><div>${cardHTML(bot)}<div class="who">${D.foe}</div></div></div>
      <div class="quiz"><h3>${Q.head}</h3><blockquote>${esc(Q.text)}</blockquote>${R?"":`<div class="timer"><i id="tbar"></i></div>`}
      <div class="answers">${Q.opts.map((o,i)=>{let c="";if(R){if(o===Q.answer)c="right";else if(i===R.pick)c="wrong";}return `<button class="${c}" data-act="answer" data-i="${i}" ${R?"disabled":""}>${esc(o)}</button>`;}).join("")}</div>`;
    if(R)h+=`<div class="result">${R.timeout?"Temps écoulé. ":R.ok?"Bonne réponse ! ":"Mauvaise réponse. "}Tu infliges <b>${R.dmgBot}</b> dégâts.<br>${D.foe} ${R.botOk?"a bien répondu":"s’est trompé"} et t’inflige <b>${R.dmgMe}</b> dégâts.
      <div class="btn-row" style="margin-top:12px"><button class="btn" data-act="next">${D.round<2?"Manche suivante":"Voir le résultat"}</button></div></div>`;
    el.innerHTML=h+`</div>`;
    if(!R)startTimer();return;
  }
  if(D.phase==="end"){
    const out=D.hpMe>D.hpBot?"Victoire":D.hpMe<D.hpBot?"Défaite":"Égalité";
    el.innerHTML=hud+`<div class="end"><div class="big-word">${out}</div><p>Tu gagnes ${D.reward} plumes.</p>
      <div class="btn-row" style="justify-content:center"><button class="btn gold" data-act="again">Rejouer avec ces cartes</button><button class="btn ghost" data-act="newsel">Changer de cartes</button></div></div>`;
  }
}
async function startDuel(){
  D.phase="loading";renderDuel();
  try{
    const bot=await buildBot();
    const my=shuffle(D.sel).map(id=>S.cards[id]);
    const others=[...myCards().map(c=>c.title),...bot.map(c=>c.title),...(MOSTREAD||[]).map(dispTitle)];
    Object.assign(D,{my,bot,qs:my.map(c=>makeQuestion(c,others)),round:0,hpMe:HP_MAX,hpBot:HP_MAX,foe:pick(FOES),res:null,phase:"battle"});
  }catch(e){D.phase="select";toast("Impossible de joindre Wikipédia");}
  renderDuel();window.scrollTo({top:0});
}
function startTimer(){
  clearInterval(timerI);const L=20000,t0=Date.now();
  timerI=setInterval(()=>{const left=Math.max(0,L-(Date.now()-t0));const b=$("#tbar");if(b)b.style.width=(left/L*100)+"%";if(left<=0){clearInterval(timerI);answer(-1);}},100);
}
function answer(i){
  if(D.res||D.phase!=="battle")return;clearInterval(timerI);
  const me=D.my[D.round],bot=D.bot[D.round],Q=D.qs[D.round];
  const ok=i>=0&&Q.opts[i]===Q.answer,botOk=Math.random()<.6;
  const myP=ok?me.atk:Math.round(me.atk*.3),botP=botOk?bot.atk:Math.round(bot.atk*.3);
  const dmgBot=Math.max(5,myP-Math.round(bot.def*.4)),dmgMe=Math.max(5,botP-Math.round(me.def*.4));
  D.hpBot=Math.max(0,D.hpBot-dmgBot);D.hpMe=Math.max(0,D.hpMe-dmgMe);
  D.res={pick:i,ok,botOk,dmgBot,dmgMe,timeout:i<0};renderDuel();
}
function nextRound(){
  if(D.round<2&&D.hpMe>0&&D.hpBot>0){D.round++;D.res=null;renderDuel();return;}
  const out=D.hpMe>D.hpBot?"win":D.hpMe<D.hpBot?"loss":"draw";
  D.reward={win:150,draw:70,loss:40}[out];S.plumes+=D.reward;
  if(out==="win")S.wins++;else if(out==="loss")S.losses++;else S.draws++;
  save();syncPurse();D.phase="end";renderDuel();
}

/* ================= Navigation ================= */
function go(t){
  tab=t;resetArmed=false;
  for(const s of ["boosters","collection","duel"])document.getElementById("v-"+s).hidden=s!==t;
  document.querySelectorAll("nav button").forEach(b=>b.removeAttribute("aria-current"));
  document.querySelector(`nav button[data-tab="${t}"]`).setAttribute("aria-current","page");
  if(t!=="duel")clearInterval(timerI);
  ({boosters:renderBoosters,collection:renderCollection,duel:renderDuel})[t]();
  if(t==="duel"&&D.phase==="battle"&&!D.res)startTimer();
  window.scrollTo({top:0});
}
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-tab]");if(nav){go(nav.dataset.tab);return;}
  const tg=e.target.closest("[data-tab-go]");if(tg){go(tg.dataset.tabGo);return;}
  const f=e.target.closest("[data-filter]");if(f){filter=f.dataset.filter;renderCollection();return;}
  if(e.target.id==="modal"){$("#modal").hidden=true;return;}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  if(act==="open")openPack(a.dataset.src);
  else if(act==="po-close")PO.close();
  else if(act==="po-again"){PO.close();openPack(bestSource());}
  else if(act==="detail")openDetail(a.dataset.id);
  else if(act==="sell")sellOne(a.dataset.id);
  else if(act==="close")$("#modal").hidden=true;
  else if(act==="reset"){
    if(!resetArmed){resetArmed=true;renderCollection();return;}
    S=defaults();save();syncPurse();D={phase:"select",sel:[]};resetArmed=false;toast("Nouvelle partie");go("boosters");
  }
  else if(act==="toggle"){const id=a.dataset.id,p=D.sel.indexOf(id);if(p>-1)D.sel.splice(p,1);else if(D.sel.length<3)D.sel.push(id);else toast("3 cartes maximum");renderDuel();}
  else if(act==="start"&&D.sel.length===3)startDuel();
  else if(act==="answer")answer(+a.dataset.i);
  else if(act==="next")nextRound();
  else if(act==="again"){D.sel=D.sel.filter(id=>S.cards[id]);if(D.sel.length===3)startDuel();else{D={phase:"select",sel:[]};renderDuel();}}
  else if(act==="newsel"){D={phase:"select",sel:[]};renderDuel();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#modal").hidden=true;});

syncPurse();renderBoosters();
mostRead();
</script>
