<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encyclocartes</title>
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Encyclocartes">
<meta name="theme-color" content="#0d1017">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Spectral:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1017; --bg2:#121620; --surface:#171c27; --surface2:#1f2532; --line:#2a3141;
  --ink:#eef1f6; --muted:#8e97a8; --dim:#5f687a;
  --gold:#e8b64c; --gold-ink:#241a04; --good:#55c98a; --bad:#ef6a5a;
  --paper:#fbf8ef; --paper-ink:#1b2028; --paper-muted:#5d6572;
  --r0:#8e9aa3; --r1:#3fae6f; --r2:#3a7be0; --r3:#9a55e6; --r4:#e0457b; --r5:#f0a823;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block}

/* ===== En-tête ===== */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(13,16,23,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-family:Spectral,Georgia,serif;font-style:italic;font-weight:600;font-size:1.2rem}
.logo i{width:26px;height:26px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:.95rem;font-style:italic}
.vip-tag{font-family:Archivo,sans-serif;font-style:normal;font-size:.68rem;font-weight:800;background:var(--gold);color:var(--gold-ink);padding:2px 6px;border-radius:5px}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.pill.gold{color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom,0px))}
h2{font-size:1.5rem;font-weight:800;margin:2px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;line-height:1.45;max-width:60ch;font-size:.95rem}

/* ===== Navigation ===== */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(13,16,23,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:var(--dim);padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;font-weight:600}
nav svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] svg{color:var(--gold)}

/* ===== Éléments ===== */
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;font-size:.98rem;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{background:none;border:0;border-radius:9px;padding:9px 6px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.84rem;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.badge{display:inline-block;font-size:.7rem;font-weight:800;color:#fff;padding:2px 7px;border-radius:5px;background:var(--rc,var(--r0))}
.t0{--rc:var(--r0)} .t1{--rc:var(--r1)} .t2{--rc:var(--r2)} .t3{--rc:var(--r3)} .t4{--rc:var(--r4)} .t5{--rc:var(--r5)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);line-height:1.5}
.meta{color:var(--muted);font-size:.86rem}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.86rem;padding:8px}

/* ===== Paquet ===== */
.pack-zone{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 22px}
.pack-hero{position:relative;width:min(200px,50vw);aspect-ratio:5/7;border:0;padding:0;background:none}
.pack-hero .stackshadow{position:absolute;inset:0;border-radius:10px;background:#1b2130;transform:translate(8px,6px) rotate(3deg)}
.pack-count{position:absolute;top:-10px;right:-10px;z-index:70;background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:999px;min-width:34px;height:34px;display:grid;place-items:center;padding:0 8px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.timer-line{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.pack{position:absolute;inset:0;z-index:60;animation:float 3.2s ease-in-out infinite;touch-action:none;user-select:none;-webkit-user-select:none}
.pack.loading{animation:wobble .45s ease-in-out infinite}
.pack.nudge{animation:wobble .4s ease-in-out 1}
.pack.torn,.pack.still{animation:none}
.pack-top,.pack-body{position:absolute;left:0;right:0;overflow:hidden;
  background-image:radial-gradient(circle at 50% 46%,rgba(255,215,130,.28),transparent 42%),
    linear-gradient(158deg,#f3d27e 0%,#b8862b 15%,#252d40 36%,#121722 64%,#2e3a57 86%,#e8b64c 100%);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
.pack-top{top:0;height:14%;border-radius:10px 10px 2px 2px;background-size:100% 714.3%;background-position:top;transition:transform .75s cubic-bezier(.25,.7,.3,1),opacity .75s;z-index:2}
.pack-top::before{content:"";position:absolute;left:0;right:0;top:0;height:60%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.32) 0 2px,rgba(0,0,0,.2) 2px 5px)}
.pack-body{top:14%;bottom:0;border-radius:2px 2px 10px 10px;background-size:100% 116.3%;background-position:bottom;transition:transform .8s cubic-bezier(.55,0,.75,.35),opacity .8s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;container-type:inline-size;text-align:center;color:#fff3d6}
.pack-body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 2px,rgba(0,0,0,.22) 2px 5px)}
.pack .emb{width:44cqw;height:44cqw;border-radius:50%;border:2cqw solid #f3d27e;display:grid;place-items:center;font-family:Spectral,Georgia,serif;font-style:italic;font-weight:600;font-size:28cqw;color:#f3d27e;background:rgba(8,11,18,.6);box-shadow:0 0 6cqw rgba(243,210,126,.35)}
.pack .pt{font-family:Spectral,Georgia,serif;font-style:italic;font-weight:700;font-size:12cqw}
.pack .ps{font-weight:700;font-size:6.5cqw}
.pack .ps2{font-size:5.5cqw;opacity:.8}
.pack .shine{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:10px;mix-blend-mode:overlay;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.8) 45%,rgba(160,200,255,.5) 52%,transparent 66%);background-size:300% 100%;animation:sheen 3.6s linear infinite}
.cutline{position:absolute;left:5%;right:5%;top:14%;z-index:4;border-top:2px dashed rgba(255,255,255,.65)}
.cutline i{position:absolute;left:0;top:-3px;height:4px;width:0;border-radius:2px;background:#fff;box-shadow:0 0 10px 2px #fff}
.pack-top.off{transform:translate(65%,-160%) rotate(32deg);opacity:0}
.pack-body.drop{transform:translateY(125%);opacity:0}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.odds div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.8rem}
.odds b{display:block;font-size:.95rem;margin-top:3px;font-variant-numeric:tabular-nums}

/* ===== Ouverture ===== */
.po{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(ellipse at 50% 42%,#26304a 0%,#07090e 72%);padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden}
.po[hidden]{display:none}
.po-stage{position:relative;width:min(250px,62vw);aspect-ratio:5/7}
.po-stage.wide{width:min(600px,94vw);aspect-ratio:auto}
.po-hint{margin:0;min-height:2.6em;text-align:center;font-weight:600;line-height:1.3;max-width:30ch}
.po-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.po-actions[hidden],.po-x[hidden]{display:none}
.po-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.1);font-size:1.1rem}
.stack{position:absolute;inset:0;z-index:50;cursor:pointer}
.scard{position:absolute;inset:0;perspective:1100px;transform:translateY(22%) scale(.86);opacity:0;transition:transform .6s cubic-bezier(.25,.8,.3,1),opacity .5s}
.stack.in .scard{opacity:1;transform:translateY(calc(var(--k) * -5px)) rotate(calc(var(--k) * -1.6deg))}
.stack.in .scard.gone{transform:translate(-150%,-6%) rotate(-20deg);opacity:0}
.scard .inner{position:absolute;inset:0;transition:transform .75s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d}
.scard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.face.front .card{height:100%}
.scard.top.g2 .cardback{animation:glow 1.6s ease-in-out infinite;--gc:var(--r2)}
.scard.top.g3 .cardback{animation:glow 1.2s ease-in-out infinite;--gc:var(--r3)}
.scard.top.g4 .cardback{animation:glow .9s ease-in-out infinite;--gc:var(--r4)}
.scard.top.g5 .cardback{animation:glow .6s ease-in-out infinite;--gc:var(--r5)}
.scard.charge .inner{animation:charge .7s ease-in}
@keyframes glow{0%,100%{box-shadow:0 0 14px 2px var(--gc)}50%{box-shadow:0 0 40px 12px var(--gc)}}
@keyframes charge{0%{transform:scale(1)}20%{transform:scale(1.03) rotate(-2deg)}40%{transform:scale(1.05) rotate(2deg)}60%{transform:scale(1.07) rotate(-2deg)}80%{transform:scale(1.09) rotate(2deg)}100%{transform:scale(1.1)}}
.new-tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:5;background:var(--gold);color:var(--gold-ink);font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .3s .5s;pointer-events:none}
.scard.flipped .new-tag,.new-tag.on{opacity:1}
.spark{position:fixed;z-index:120;width:9px;height:9px;margin:-4px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);pointer-events:none;animation:spark .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
.flash{position:fixed;inset:0;z-index:110;pointer-events:none;background:radial-gradient(circle at 50% 45%,#fff 0%,var(--c) 30%,transparent 70%);animation:flash .9s ease-out forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.sum-c{position:relative;animation:pop .45s cubic-bezier(.3,1.4,.5,1) backwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* ===== Carte ===== */
.card{--rc:var(--r0);container-type:inline-size;position:relative;width:100%;aspect-ratio:5/7;background:var(--paper);color:var(--paper-ink);border-radius:9px;border:3px solid var(--rc);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 22px -10px rgba(0,0,0,.7)}
.card.alt{background:#111317;color:#f3eee0}
.card.alt .desc,.card.alt .stats .v{color:#a9a390}
.card .ph{position:relative;height:57%;flex:none;background:hsl(var(--hue) 28% 70%);overflow:hidden}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:Spectral,Georgia,serif;font-weight:700;font-size:40cqw;color:hsla(var(--hue),40%,20%,.45)}
.card .rb{position:absolute;left:0;bottom:0;z-index:1;background:var(--rc);color:#fff;font-weight:700;font-size:6.2cqw;padding:1.6cqw 4cqw;border-top-right-radius:4cqw}
.card .name{font-family:Spectral,Georgia,serif;font-weight:700;font-size:8.6cqw;line-height:1.08;padding:3cqw 4cqw 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .desc{flex:1;font-size:5.6cqw;line-height:1.25;color:var(--paper-muted);padding:1.2cqw 4cqw 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .stats{display:flex;gap:4cqw;align-items:center;padding:1.5cqw 4cqw 3cqw;font-weight:800;font-size:6.4cqw;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .stats .v{margin-left:auto;font-weight:600;color:var(--paper-muted)}
.card.t5::after,.card.t4::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;z-index:2;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.8) 42%,rgba(255,200,90,.6) 48%,rgba(140,220,255,.6) 54%,transparent 68%);background-size:260% 260%;animation:holo 3.2s linear infinite}
.card.t4::after{opacity:.5;animation-duration:4.5s}
@keyframes holo{from{background-position:130% 0}to{background-position:-130% 0}}
.cardback{width:100%;height:100%;border-radius:9px;border:3px solid #c9a75a;background:#121722;background-image:repeating-linear-gradient(45deg,rgba(232,182,76,.13) 0 6px,transparent 6px 12px);display:grid;place-items:center;container-type:inline-size;box-shadow:0 10px 24px -8px rgba(0,0,0,.7)}
.cardback span{font-family:Spectral,Georgia,serif;font-style:italic;font-weight:600;color:var(--gold);font-size:32cqw;border:1.2cqw solid var(--gold);border-radius:50%;width:52cqw;height:52cqw;display:grid;place-items:center;background:#121722}

/* ===== Collection ===== */
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-strip div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat-strip b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat-strip span{font-size:.78rem;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink);font:inherit;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:14px 12px}
.pick{position:relative;border:0;padding:0;background:none;text-align:left;border-radius:10px}
.count{position:absolute;bottom:-7px;right:-5px;z-index:3;background:var(--ink);color:var(--bg);font-size:.75rem;font-weight:800;border-radius:999px;padding:2px 7px}
.pick.sel .card{outline:3px solid var(--gold);outline-offset:3px}
.pick .order{position:absolute;top:-8px;left:-6px;z-index:3;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font-weight:800;display:grid;place-items:center;font-size:.85rem}

/* ===== Marché ===== */
.mk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 8px}
.thumb{width:52px;height:68px;border-radius:7px;overflow:hidden;border:2px solid var(--rc);background:var(--surface2);position:relative;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:Spectral,serif;font-weight:700;color:var(--muted)}
.ri{min-width:0}
.rt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{font-size:.78rem;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rp{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.price{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.lock{text-align:center;padding:28px 18px}
.lock .crown{width:44px;height:44px;margin:0 auto 10px;color:var(--gold)}

/* ===== Feuille ===== */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,10,.7)}
.modal[hidden]{display:none}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:min(520px,100%);max-height:90%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet .big{width:min(210px,58vw);margin:0 auto 16px}
.sheet p{line-height:1.5;margin:0 0 12px}
.sheet a{color:var(--gold);font-weight:600}
.sheet h3{margin:0 0 12px;font-size:1.15rem}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 14px;margin:6px 0 8px}
.field input{flex:1;background:none;border:0;font-size:1.2rem;font-weight:700;padding:10px 0;min-width:0}
.field input:focus{outline:none}
label.lbl{font-size:.85rem;color:var(--muted);font-weight:600}
.actions{display:grid;gap:8px;margin-top:6px}

/* ===== Duel ===== */
.sticky-cta{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin-top:18px;display:flex;justify-content:center}
.sticky-cta .btn{box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:240px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.hp{font-size:.86rem;font-weight:700}
.hp .lbl{display:flex;justify-content:space-between;margin-bottom:5px;gap:6px}
.hp .lbl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hp .track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.hp .fill{height:100%;background:var(--good);border-radius:5px;transition:width .5s}
.hp.foe .fill{background:var(--bad)}
.round-lbl{text-align:center;color:var(--muted);font-weight:600;margin:0 0 12px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;max-width:420px;margin:0 auto 16px}
.vs{font-family:Spectral,Georgia,serif;font-style:italic;font-size:1.3rem;color:var(--gold)}
.who{text-align:center;font-size:.8rem;color:var(--muted);margin-top:6px;font-weight:600}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.quiz h3{font-size:.9rem;margin:0 0 8px;color:var(--muted)}
.quiz blockquote{font-family:Spectral,Georgia,serif;font-size:1.08rem;line-height:1.45;margin:0 0 12px}
.timer{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.answers{display:grid;gap:8px}
.answers button{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;font-weight:600}
.answers button.right{border-color:var(--good);background:rgba(85,201,138,.15)}
.answers button.wrong{border-color:var(--bad);background:rgba(239,106,90,.15)}
.result{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);line-height:1.5}
.end{text-align:center;padding:16px 0}
.end .big-word{font-family:Spectral,Georgia,serif;font-weight:700;font-size:3rem;margin:4px 0}
.end p{color:var(--muted);margin:0 0 20px}
.loading-box{text-align:center;padding:50px 0;color:var(--muted)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ===== VIP ===== */
.vip-hero{text-align:center;padding:26px 18px;border-radius:20px;border:1px solid rgba(232,182,76,.4);background:radial-gradient(circle at 50% 0%,rgba(232,182,76,.22),transparent 65%),var(--surface);margin-bottom:16px}
.vip-hero svg{width:48px;height:48px;margin:0 auto 8px;color:var(--gold)}
.vip-hero h2{font-family:Spectral,Georgia,serif;font-style:italic;font-size:2rem}
.vip-price{font-size:1.1rem;font-weight:700;margin:6px 0 16px}
.cmp{display:grid;grid-template-columns:1fr auto auto;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.cmp div{padding:11px 12px;border-bottom:1px solid var(--line);font-size:.88rem}
.cmp div:nth-last-child(-n+3){border-bottom:0}
.cmp .h{font-weight:800;color:var(--muted);font-size:.78rem;background:var(--surface)}
.cmp .c{text-align:center;color:var(--muted);min-width:76px}
.cmp .v{text-align:center;color:var(--gold);font-weight:700;min-width:76px;background:rgba(232,182,76,.06)}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:130;background:var(--ink);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:999px;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:640px){.sum{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}.odds{grid-template-columns:repeat(6,1fr)}}
@media (prefers-reduced-motion:reduce){
  .pack,.pack.loading,.pack .shine,.card.t5::after,.card.t4::after,.scard .cardback,.sheet{animation:none!important}
  .scard,.scard .inner,.pack-top,.pack-body{transition-duration:.01s}
}
</style>

<body>

  <div class="logo"><i>E</i>Encyclocartes<span class="vip-tag" id="vipTag" hidden>VIP</span></div>
  <div class="pills"><span class="pill" id="packPill" aria-label="Paquets disponibles"></span><span class="pill gold" id="credPill" aria-label="Crédits"></span></div>

<main>

<nav aria-label="Navigation">
  <button data-tab="boosters" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M6 7h12M10 13l2-2 2 2-2 2z"/></svg>Paquets</button>
  <button data-tab="collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/></svg>Collection</button>
  <button data-tab="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.6"/></svg>Marché</button>
  <button data-tab="duel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M9.5 6.5 13 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"/></svg>Duel</button>
  <button data-tab="vip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>VIP</button>

<div class="po" id="po" hidden>
  <button class="po-x" id="poClose" data-act="po-close" aria-label="Fermer" hidden>✕</button>
  <div class="po-stage" id="poStage"></div>

</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= Réglages (à modifier) ================= */
const CFG = {
  VIP_PRICE: "4,99 € par mois",
  VIP_DAYS: 30,
  // Colle ici ton lien de paiement Stripe (Payment Link), ex : "https://buy.stripe.com/xxxx"
  VIP_PAYMENT_URL: "",
  // Empreintes des codes VIP valides (chaque code ne marche qu'une fois par appareil)
  VIP_CODE_HASHES: [2014571582,3566297023,3057983495,981653755,4189377130,3134079148,739230650,4159972416,1515264499,2737460610],
  PACK_PRICE: 200,
  MAX_PACKS: 10,
};
const PERKS = {
  free:{interval:10*60e3,duels:5,listings:3},
  vip: {interval:3*60e3, duels:20,listings:15},
};

/* ================= Raretés ================= */
const API = "https://fr.wikipedia.org/api/rest_v1";
const KEY = "encyclocartes-v3", HP_MAX = 250, ALT_RATE = 0.01;
// Seuils de vues sur 30 jours, calés sur la répartition de WikiMasters
const T = [
  {i:0,name:"Commune",short:"C",min:0,value:5},
  {i:1,name:"Peu commune",short:"PC",min:100,value:15},
  {i:2,name:"Rare",short:"R",min:400,value:40},
  {i:3,name:"Super rare",short:"SR",min:1200,value:120},
  {i:4,name:"Ultra rare",short:"UR",min:5000,value:450},
  {i:5,name:"Légendaire",short:"L",min:20000,value:2500},
];
const ODDS = [71.98,18.62,6.48,2.41,0.45,0.06];
const FAMOUS = ["France","Paris","Napoléon_Ier","Seconde_Guerre_mondiale","Kylian_Mbappé","Victor_Hugo","Albert_Einstein","Louis_XIV","Tour_Eiffel","Charles_de_Gaulle","Zinédine_Zidane","Lionel_Messi","Cristiano_Ronaldo","Molière","Jeanne_d'Arc","Révolution_française","Marie_Curie","Lune","Michael_Jackson","Minecraft","Titanic","Léonard_de_Vinci","La_Joconde","Pyramide_de_Khéops","Château_de_Versailles","Rome","Londres","New_York","Tokyo","Empire_romain","Jules_César","Cléopâtre_VII","Isaac_Newton","Johnny_Hallyday","Star_Wars","Harry_Potter","One_Piece","Pokémon","Fortnite","Colisée","Statue_de_la_Liberté"];
const SELLERS = ["Kylian_du_72","Wikilover","LaGrandeEncyclo","Capucine.R","xX_Savoir_Xx","Mehdi93","Bibliothécaire","Jojo_Collec","NinaLaRare","TheLegendHunter","Papy_Wiki","Lou.Cartes"];
const FOES = ["L’Archiviste","Le Bibliothécaire","La Conservatrice","Le Rédacteur fou","La Correctrice"];

/* ================= État ================= */
const defaults = () => ({credits:300,cards:{},packs:3,packT:Date.now(),wins:0,losses:0,draws:0,vipUntil:0,usedCodes:[],day:"",duelsToday:0,listToday:0,listings:[],market:{t:0,items:[]},history:[],drawn:[0,0,0,0,0,0],opened:0});
let S;
try{
  const raw=localStorage.getItem(KEY), old=raw?JSON.parse(raw):null;
  S=Object.assign(defaults(),old||{});
  if(old&&old.credits==null&&old.plumes!=null)S.credits=old.plumes;
  if(old&&old.packs==null&&old.bonus!=null)S.packs=Math.min(CFG.MAX_PACKS,old.bonus+1);
  if(!Array.isArray(S.drawn)||S.drawn.length!==6)S.drawn=[0,0,0,0,0,0];
}catch(e){S=defaults();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

let tab="boosters", filter="all", sortBy="rarity", mkTab="buy", mkLoading=false, armed=null, packBusy=false;
let D={phase:"select",sel:[]};
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= Utilitaires ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const tierOf=v=>{let t=T[0];for(const x of T)if(v>=x.min)t=x;return t;};
const fmt=v=>v>=1e6?(v/1e6).toFixed(1).replace(".",",")+" M":v>=1e4?Math.round(v/1e3)+" k":v>=1e3?(v/1e3).toFixed(1).replace(".",",")+" k":String(v);
const num=n=>n.toLocaleString("fr-FR");
const mmss=ms=>{const s=Math.ceil(ms/1000),m=Math.floor(s/60);return `${m}:${String(s%60).padStart(2,"0")}`;};
const ago=t=>{const m=Math.floor((Date.now()-t)/60000);return m<1?"à l’instant":m<60?`il y a ${m} min`:`il y a ${Math.floor(m/60)} h`;};
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2400);}
const isVip=()=>Date.now()<S.vipUntil;
const perks=()=>isVip()?PERKS.vip:PERKS.free;
const myCards=()=>Object.values(S.cards).filter(c=>c.count>0);
const value=c=>Math.max(1,Math.round(T[c.ti].value*(c.alt?5:1)*(.85+(hash(c.title)%30)/100)));
function today(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}
function dayCheck(){const d=today();if(S.day!==d){S.day=d;S.duelsToday=0;S.listToday=0;save();}}
function addCard(c){const ex=S.cards[c.id];if(ex)ex.count++;else S.cards[c.id]={...c,count:1};}

/* ================= Paquets qui se rechargent ================= */
function regen(){
  const now=Date.now(),iv=perks().interval;
  if(S.packs>=CFG.MAX_PACKS){S.packT=now;return;}
  const n=Math.floor((now-S.packT)/iv);
  if(n>0){S.packs=Math.min(CFG.MAX_PACKS,S.packs+n);S.packT=S.packs>=CFG.MAX_PACKS?now:S.packT+n*iv;save();}
}
const nextPackIn=()=>S.packs>=CFG.MAX_PACKS?0:Math.max(0,S.packT+perks().interval-Date.now());
function syncHeader(){
  $("#credPill").innerHTML=`<span aria-hidden="true">◈</span> ${num(S.credits)}`;
  $("#packPill").innerHTML=`<span aria-hidden="true">🎴</span> ${S.packs}/${CFG.MAX_PACKS}`;
  $("#vipTag").hidden=!isVip();
}

/* ================= Wikipédia ================= */
async function getJSON(u){
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);
  try{const r=await fetch(u,{signal:ac.signal,cache:"no-store"});if(!r.ok)throw new Error(r.status);return await r.json();}
  finally{clearTimeout(tm);}
}
const apiTitle=s=>s.titles?.canonical||s.title;
const dispTitle=s=>s.titles?.normalized||String(s.title).replace(/_/g," ");
const okPage=s=>s&&s.type==="standard"&&!/^(Spécial|Wikipédia|Portail|Fichier|Catégorie|Aide|Modèle):/.test(apiTitle(s));
const summary=t=>getJSON(`${API}/page/summary/${encodeURIComponent(t.replace(/ /g,"_"))}`);
const randomSummary=()=>getJSON(`${API}/page/random/summary?r=${Math.random()}`);
const ymd=d=>d.toISOString().slice(0,10).replace(/-/g,"");
async function views30(title){
  const end=new Date(Date.now()-864e5),start=new Date(Date.now()-30*864e5);
  const u=`https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/fr.wikipedia/all-access/user/${encodeURIComponent(title.replace(/ /g,"_"))}/daily/${ymd(start)}00/${ymd(end)}00`;
  try{const j=await getJSON(u);return (j.items||[]).reduce((a,i)=>a+(i.views||0),0);}catch(e){return 0;}
}
let MOSTREAD=null;
async function mostRead(){
  if(MOSTREAD)return MOSTREAD;
  for(const back of [1,2]){
    const d=new Date(Date.now()-back*864e5);
    const y=d.getUTCFullYear(),m=String(d.getUTCMonth()+1).padStart(2,"0"),dd=String(d.getUTCDate()).padStart(2,"0");
    try{const j=await getJSON(`${API}/feed/featured/${y}/${m}/${dd}`);const l=(j.mostread?.articles||[]).filter(okPage);if(l.length){MOSTREAD=l;return l;}}catch(e){}
  }
  MOSTREAD=[];return MOSTREAD;
}
function toCard(s,views){
  const title=dispTitle(s),t=tierOf(views),h=hash(title),base=Math.round(14+Math.log10(views+10)*18);
  return {id:title,api:apiTitle(s),title,img:s.thumbnail?.source||"",desc:s.description||"",
    extract:(s.extract||"").slice(0,700),url:s.content_urls?.desktop?.page||`https://fr.wikipedia.org/wiki/${encodeURIComponent(apiTitle(s))}`,
    views,ti:t.i,atk:base+(h%15)-7,def:base+((h>>>8)%15)-7,hue:h%360,alt:false};
}
function maybeAlt(c){if(Math.random()<ALT_RATE){c.alt=true;c.id=c.title+" (noire)";c.atk+=10;c.def+=10;}return c;}
async function randomArticle(){for(let k=0;k<5;k++){try{const s=await randomSummary();if(okPage(s))return s;}catch(e){}}return null;}
async function randomCard(){const s=await randomArticle();if(!s)return null;return toCard(s,await views30(apiTitle(s)));}
// Tirage uniforme sur tout Wikipédia. En VIP : 2 tirages par carte, on garde le plus lu.
async function drawOne(){
  if(!isVip())return randomCard();
  const [a,b]=await Promise.all([randomCard(),randomCard()]);
  if(!a)return b;if(!b)return a;return a.views>=b.views?a:b;
}
async function buildPack(){
  const got=(await Promise.all([...Array(5)].map(()=>drawOne()))).filter(Boolean);
  const seen=new Set(),uniq=[];
  for(const c of got)if(!seen.has(c.id)){seen.add(c.id);uniq.push(c);}
  while(uniq.length<5){const c=await drawOne();if(!c)break;if(!seen.has(c.id)){seen.add(c.id);uniq.push(c);}}
  if(uniq.length<3)throw new Error("wiki");
  return uniq.map(maybeAlt).sort((a,b)=>a.ti-b.ti||a.views-b.views);
}

/* ================= Rendu ================= */
function cardHTML(c){
  return `<div class="card t${c.ti}${c.alt?" alt":""}" style="--hue:${c.hue}">
    <div class="ph">${c.img?`<img src="${esc(c.img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:""}<span class="ini" aria-hidden="true">${esc(c.title[0]||"?")}</span><span class="rb">${T[c.ti].name}${c.alt?" noire":""}</span></div>
    <div class="name">${esc(c.title)}</div>
    <div class="desc">${esc(c.desc||c.extract)}</div>
    <div class="stats"><span title="Attaque">⚔️ ${c.atk}</span><span title="Défense">🛡️ ${c.def}</span><span class="v" title="Vues sur 30 jours">👁 ${fmt(c.views)}</span></div>
  </div>`;
}
const thumbInner=c=>`${c.img?`<img src="${esc(c.img)}" alt="" loading="lazy" onerror="this.remove()">`:""}<span class="ini">${esc(c.title[0]||"?")}</span>`;
const thumbHTML=c=>`<span class="thumb t${c.ti}">${thumbInner(c)}</span>`;
const badge=c=>`<span class="badge t${c.ti}">${T[c.ti].short}${c.alt?" noire":""}</span>`;
const packHTML=live=>`<div class="pack ${live?"":"still"}">
  <div class="pack-top"></div>${live?'<div class="cutline"><i id="cut"></i></div>':""}
  <div class="pack-body"><div class="emb">E</div><div class="pt">Encyclocartes</div><div class="ps">Paquet de 5 cartes</div><div class="ps2">Articles de Wikipédia</div></div>
  <div class="shine"></div></div>`;
const crownSVG=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>`;

/* ================= Ouverture ================= */
function openPack(how){
  if(packBusy)return;
  regen();
  if(how==="buy"){
    if(S.credits<CFG.PACK_PRICE){toast("Pas assez de crédits");return;}
    S.credits-=CFG.PACK_PRICE;
  }else{
    if(S.packs<=0){toast("Plus de paquet, reviens plus tard");return;}
    if(S.packs>=CFG.MAX_PACKS)S.packT=Date.now();
    S.packs--;
  }
  packBusy=true;save();syncHeader();renderBoosters();PO.start(how);
}
function refund(how){if(how==="buy")S.credits+=CFG.PACK_PRICE;else S.packs=Math.min(CFG.MAX_PACKS,S.packs+1);save();syncHeader();}
const PO={
  hint(t){$("#poHint").textContent=t;},
  start(how){
    Object.assign(this,{how,cards:null,i:0,phase:"pack",ready:false,prog:0,lock:false});
    $("#po").hidden=false;document.body.style.overflow="hidden";
    $("#poActions").hidden=true;$("#poActions").innerHTML="";$("#poClose").hidden=true;
    const st=$("#poStage");st.className="po-stage";st.innerHTML=packHTML(true);
    const pack=st.querySelector(".pack");pack.classList.add("loading");
    this.hint("Préparation du paquet…");this.bindDrag(pack);
    buildPack().then(cards=>{
      this.cards=cards.map(c=>{const isNew=!S.cards[c.id];addCard(c);S.drawn[c.ti]++;return {c,isNew};});
      S.opened++;save();this.ready=true;pack.classList.remove("loading");
      this.hint("Glisse ton doigt sur le haut du paquet pour le déchirer");
    }).catch(()=>{
      refund(this.how);pack.classList.remove("loading");this.phase="failed";
      this.hint("Impossible de joindre Wikipédia. Vérifie ta connexion, ton paquet t’a été rendu.");
      $("#poClose").hidden=false;
    });
  },
  bindDrag(pack){
    let sx=null,w=1,moved=false;
    pack.addEventListener("pointerdown",e=>{if(this.phase!=="pack")return;sx=e.clientX;w=pack.getBoundingClientRect().width;moved=false;try{pack.setPointerCapture(e.pointerId);}catch(_){}});
    pack.addEventListener("pointermove",e=>{
      if(sx===null||!this.ready||this.phase!=="pack")return;
      const p=Math.min(1,Math.abs(e.clientX-sx)/(w*.8));if(p>.06)moved=true;
      this.prog=Math.max(this.prog,p);$("#cut").style.width=(this.prog*100)+"%";
      if(this.prog>=1){sx=null;this.tear();}
    });
    pack.addEventListener("pointerup",()=>{
      if(sx===null)return;sx=null;
      if(!this.ready){pack.classList.add("nudge");setTimeout(()=>pack.classList.remove("nudge"),420);return;}
      if(!moved||this.prog>.55)this.tear();else{this.prog=0;$("#cut").style.width="0";}
    });
    pack.addEventListener("pointercancel",()=>{sx=null;});
  },
  tear(){
    if(this.phase!=="pack"||!this.ready)return;
    this.phase="tearing";
    const st=$("#poStage"),pack=st.querySelector(".pack");
    $("#cut").style.width="100%";pack.classList.add("torn");
    if(navigator.vibrate)navigator.vibrate(25);
    pack.querySelector(".pack-top").classList.add("off");
    const stack=document.createElement("div");stack.className="stack";
    this.cards.forEach((p,i)=>{
      const el=document.createElement("div");
      el.className=`scard g${p.c.alt?Math.max(p.c.ti,4):p.c.ti}`;el.style.zIndex=String(50-i);el.style.setProperty("--k",i);
      el.innerHTML=`<div class="inner"><div class="face"><div class="cardback"><span>E</span></div></div><div class="face front">${cardHTML(p.c)}</div></div>${p.isNew?'<span class="new-tag">Nouvelle</span>':""}`;
      stack.appendChild(el);
    });
    stack.addEventListener("click",()=>this.tapTop());
    st.insertBefore(stack,pack);this.hint("");
    setTimeout(()=>pack.querySelector(".pack-body").classList.add("drop"),300);
    requestAnimationFrame(()=>requestAnimationFrame(()=>stack.classList.add("in")));
    setTimeout(()=>{pack.remove();this.phase="reveal";this.markTop();},1050);
  },
  markTop(){
    const els=[...document.querySelectorAll(".scard")];
    els.forEach(e=>e.classList.remove("top"));
    if(els[this.i])els[this.i].classList.add("top");
    this.hint(`Touche la carte pour la révéler (${this.i+1} sur ${this.cards.length})`);
  },
  tapTop(){
    if(this.phase!=="reveal"||this.lock)return;
    const el=document.querySelectorAll(".scard")[this.i];if(!el)return;
    const p=this.cards[this.i],lvl=p.c.alt?Math.max(p.c.ti,4):p.c.ti;
    if(!el.classList.contains("flipped")){
      this.lock=true;
      const flip=()=>{
        el.classList.remove("top");el.classList.add("flipped");
        if(lvl>=2)setTimeout(()=>fx(lvl),260);
        if(lvl>=4&&navigator.vibrate)navigator.vibrate([40,40,80]);
        this.hint(`${T[p.c.ti].name}${p.c.alt?" noire":""}${p.isNew?", nouvelle carte !":""} Touche pour continuer`);
        setTimeout(()=>{this.lock=false;},350);
      };
      if(lvl>=4&&!reduced){el.classList.add("charge");setTimeout(()=>{el.classList.remove("charge");flip();},700);}
      else flip();
    }else{
      el.classList.add("gone");this.i++;
      if(this.i>=this.cards.length){this.lock=true;setTimeout(()=>{this.lock=false;this.summary();},420);}
      else this.markTop();
    }
  },
  summary(){
    this.phase="summary";
    const st=$("#poStage");st.className="po-stage wide";
    st.innerHTML=`<div class="sum">${this.cards.slice().reverse().map((p,k)=>`<div class="sum-c" style="animation-delay:${k*70}ms">${p.isNew?'<span class="new-tag on">Nouvelle</span>':""}${cardHTML(p.c)}</div>`).join("")}</div>`;
    const nNew=this.cards.filter(p=>p.isNew).length;
    this.hint(nNew?`${nNew} nouvelle${nNew>1?"s":""} carte${nNew>1?"s":""} dans ta collection`:"Que des doublons, revends-les au marché");
    regen();
    $("#poActions").innerHTML=`<button class="btn ghost" data-act="po-close">Fermer</button>${S.packs>0?`<button class="btn gold" data-act="po-again">Ouvrir le suivant (${S.packs})</button>`:""}`;
    $("#poActions").hidden=false;
  },
  close(){
    $("#po").hidden=true;document.body.style.overflow="";
    $("#poActions").hidden=true;$("#poStage").innerHTML="";
    this.phase="idle";packBusy=false;renderCurrent();
  }
};
function fx(ti){
  if(reduced)return;
  const col=getComputedStyle(document.documentElement).getPropertyValue(`--r${ti}`).trim();
  const r=$("#poStage").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  if(ti>=4){const f=document.createElement("div");f.className="flash";f.style.setProperty("--c",col);document.body.appendChild(f);setTimeout(()=>f.remove(),950);}
  const n=ti===5?50:ti===4?36:ti===3?24:14,reach=ti===5?300:ti===4?230:ti===3?180:140;
  for(let k=0;k<n;k++){
    const s=document.createElement("i"),a=Math.random()*Math.PI*2,d=reach*(.45+Math.random()*.55);
    s.className="spark";
    s.style.cssText=`left:${cx}px;top:${cy}px;--c:${col};--dx:${(Math.cos(a)*d).toFixed(0)}px;--dy:${(Math.sin(a)*d).toFixed(0)}px;animation-delay:${Math.floor(Math.random()*90)}ms`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),1300);
  }
}

function tickMarket(){
  const now=Date.now();let sold=[];
  S.listings=S.listings.filter(l=>{
    const mins=(now-l.last)/60000;l.last=now;
    const ratio=value(l.card)/l.price,rate=.07*Math.pow(Math.min(ratio,4),3);

let timerI=null;
function makeQuestion(card,others){
  const ex=card.extract||"";
  const sents=ex.match(/[^.!?]+[.!?]+/g)||(ex?[ex]:[]);
  const yr=sents.map(s=>({s:s.trim(),m:s.match(/\b(1[0-9]{3}|20[0-2][0-9])\b/)})).filter(x=>x.m);
  const pool=[...new Set(others.filter(t=>t&&t!==card.title))];
  const canMask=pool.length>=3&&ex.length>40;
  if(yr.length&&(!canMask||Math.random()<.5)){
    const {s,m}=pick(yr),y=+m[1],set=new Set([y]);
    while(set.size<4){const v=y+(Math.floor(Math.random()*25)+1)*(Math.random()<.5?-1:1);if(v>0&&v<=2026)set.add(v);}
    let txt=s.replace(m[1],"____");if(txt.length>280)txt=txt.slice(0,280)+"…";
    return {head:"Complète l’extrait de l’article",text:txt,opts:shuffle([...set].map(String)),answer:String(y)};
  }
  if(canMask){
    let txt=sents.slice(0,2).join(" ").trim();
    for(const w of card.title.split(/[\s'’\-(),:]+/).filter(w=>w.length>=3))txt=txt.replace(new RegExp(escRe(w),"gi"),"▢▢▢");
    if(txt.length>280)txt=txt.slice(0,280)+"…";
    return {head:"De quel article vient cet extrait ?",text:txt,opts:shuffle([card.title,...shuffle(pool).slice(0,3)]),answer:card.title};
  }
  const b=["Moins de 400","De 400 à 1 200","De 1 200 à 5 000","Plus de 5 000"];
  return {head:"Combien de vues en 30 jours ?",text:card.title,opts:b,answer:b[card.views<400?0:card.views<1200?1:card.views<5000?2:3]};
}

  if(picks.length<3)throw new Error("bot");
  return Promise.all(picks.slice(0,3).map(async s=>toCard(s,await views30(apiTitle(s)))));

  }
  if(D.phase==="loading"){el.innerHTML=`<div class="loading-box">Recherche d’un adversaire<span class="dots"></span></div>`;return;}
  const hp=(l,v,foe)=>`<div class="hp ${foe?"foe":""}"><div class="lbl"><span>${l}</span><span>${v} PV</span></div><div class="track"><div class="fill" style="width:${v/HP_MAX*100}%"></div></div></div>`;
  const hud=`<div class="hud">${hp("Toi",D.hpMe)}${hp(D.foe,D.hpBot,true)}</div>`;
  if(D.phase==="battle"){
    const me=D.my[D.round],bot=D.bot[D.round],Q=D.qs[D.round],R=D.res;
    let h=hud+`<p class="round-lbl">Manche ${D.round+1} sur 3</p>
      <div class="arena"><div>${cardHTML(me)}<div class="who">Ta carte</div></div><div class="vs">contre</div><div>${cardHTML(bot)}<div class="who">${D.foe}</div></div></div>
      <div class="quiz"><h3>${Q.head}</h3><blockquote>${esc(Q.text)}</blockquote>${R?"":`<div class="timer"><i id="tbar"></i></div>`}
      <div class="answers">${Q.opts.map((o,i)=>{let c="";if(R){if(o===Q.answer)c="right";else if(i===R.pick)c="wrong";}return `<button class="${c}" data-act="answer" data-i="${i}" ${R?"disabled":""}>${esc(o)}</button>`;}).join("")}</div>`;
    if(R)h+=`<div class="result">${R.timeout?"Temps écoulé. ":R.ok?"Bonne réponse ! ":"Mauvaise réponse. "}Tu infliges <b>${R.dmgBot}</b> dégâts.<br>${D.foe} ${R.botOk?"a bien répondu":"s’est trompé"} et t’inflige <b>${R.dmgMe}</b> dégâts.
      <div class="btn-row" style="margin-top:12px"><button class="btn" data-act="next">${D.round<2?"Manche suivante":"Voir le résultat"}</button></div></div>`;
    el.innerHTML=h+`</div>`;if(!R)startTimer();return;
  }
  if(D.phase==="end"){
    const out=D.hpMe>D.hpBot?"Victoire":D.hpMe<D.hpBot?"Défaite":"Égalité";
    el.innerHTML=hud+`<div class="end"><div class="big-word">${out}</div><p>Tu gagnes ◈ ${D.reward}.</p>
      <div class="btn-row" style="justify-content:center"><button class="btn gold" data-act="again">Rejouer avec ces cartes</button><button class="btn ghost" data-act="newsel">Changer de cartes</button></div></div>`;
  }
}
async function startDuel(){
  dayCheck();
  if(S.duelsToday>=perks().duels){toast("Plus de duel aujourd’hui");D={phase:"select",sel:[]};renderDuel();return;}
  D.phase="loading";renderDuel();
  try{
    const bot=await buildBot(),my=shuffle(D.sel).map(id=>S.cards[id]);
    const others=[...myCards().map(c=>c.title),...bot.map(c=>c.title),...(MOSTREAD||[]).map(dispTitle)];
    Object.assign(D,{my,bot,qs:my.map(c=>makeQuestion(c,others)),round:0,hpMe:HP_MAX,hpBot:HP_MAX,foe:pick(FOES),res:null,phase:"battle"});
    S.duelsToday++;save();
  }catch(e){D.phase="select";toast("Impossible de joindre Wikipédia");}
  renderDuel();window.scrollTo({top:0});
}
function startTimer(){
  clearInterval(timerI);const L=20000,t0=Date.now();
  timerI=setInterval(()=>{const left=Math.max(0,L-(Date.now()-t0));const b=$("#tbar");if(b)b.style.width=(left/L*100)+"%";if(left<=0){clearInterval(timerI);answer(-1);}},100);
}
function answer(i){
  if(D.res||D.phase!=="battle")return;clearInterval(timerI);
  const me=D.my[D.round],bot=D.bot[D.round],Q=D.qs[D.round];
  const ok=i>=0&&Q.opts[i]===Q.answer,botOk=Math.random()<.6;
  const myP=ok?me.atk:Math.round(me.atk*.3),botP=botOk?bot.atk:Math.round(bot.atk*.3);
  const dmgBot=Math.max(5,myP-Math.round(bot.def*.4)),dmgMe=Math.max(5,botP-Math.round(me.def*.4));
  D.hpBot=Math.max(0,D.hpBot-dmgBot);D.hpMe=Math.max(0,D.hpMe-dmgMe);
  D.res={pick:i,ok,botOk,dmgBot,dmgMe,timeout:i<0};renderDuel();
}
function nextRound(){
  if(D.round<2&&D.hpMe>0&&D.hpBot>0){D.round++;D.res=null;renderDuel();return;}
  const out=D.hpMe>D.hpBot?"win":D.hpMe<D.hpBot?"loss":"draw";
  D.reward={win:150,draw:70,loss:40}[out];S.credits+=D.reward;
  if(out==="win")S.wins++;else if(out==="loss")S.losses++;else S.draws++;
  save();syncHeader();D.phase="end";renderDuel();
}

/* ================= VIP ================= */
function renderVip(){
  const on=isVip(),f=PERKS.free,v=PERKS.vip;
  const rows=[
    ["Un paquet toutes les",`${f.interval/60e3} min`,`${v.interval/60e3} min`],
    ["Rareté des cartes","Normale","Boostée"],
    ["Duels par jour",f.duels,v.duels],
    ["Mises en vente par jour",f.listings,v.listings],
    ["Historique du marché","Non","Oui"],
    ["Stats de tirage","Non","Oui"],
    ["Badge VIP","Non","Oui"],
  ];
  $("#v-vip").innerHTML=`
  <div class="vip-hero">${crownSVG}<h2>Encyclocartes VIP</h2>
    ${on?`<p class="vip-price">Actif jusqu’au ${new Date(S.vipUntil).toLocaleDateString("fr-FR")}</p>`
        :`<p class="vip-price">${CFG.VIP_PRICE}</p><button class="btn gold" data-act="vip-buy">Devenir VIP</button>`}
  </div>
  <div class="cmp"><div class="h">Avantage</div><div class="h c">Gratuit</div><div class="h v">VIP</div>
    ${rows.map(r=>`<div>${r[0]}</div><div class="c">${r[1]}</div><div class="v">${r[2]}</div>`).join("")}</div>
  <div class="panel"><label class="lbl" for="codeIn">Tu as un code VIP ?</label>
    <div class="field"><input id="codeIn" type="text" autocapitalize="characters" autocomplete="off" placeholder="VIP-XXXXXXXX" style="font-size:1rem"><button class="btn gold sm" data-act="vip-code">Activer</button></div>
    <p class="meta" style="margin:0">Après ton paiement, tu reçois un code à saisir ici. Il active ${CFG.VIP_DAYS} jours de VIP.</p></div>`;
}
function vipBuy(){
  if(CFG.VIP_PAYMENT_URL)window.open(CFG.VIP_PAYMENT_URL,"_blank","noopener");
  else toast("Le paiement arrive bientôt");
}
function vipCode(){
  const code=($("#codeIn").value||"").trim().toUpperCase(),h=hash(code);
  if(!code)return;
  if(!CFG.VIP_CODE_HASHES.includes(h)){toast("Code invalide");return;}
  if(S.usedCodes.includes(h)){toast("Ce code a déjà été utilisé");return;}
  regen();
  S.usedCodes.push(h);S.vipUntil=Math.max(Date.now(),S.vipUntil)+CFG.VIP_DAYS*864e5;
  save();syncHeader();toast("VIP activé, profite bien !");renderVip();
}

/* ================= Navigation ================= */
const RENDER={boosters:renderBoosters,collection:renderCollection,market:renderMarket,duel:renderDuel,vip:renderVip};
function renderCurrent(){RENDER[tab]();}
function go(t){
  tab=t;armed=null;closeSheet();
  for(const s in RENDER)document.getElementById("v-"+s).hidden=s!==t;
  document.querySelectorAll("nav button").forEach(b=>b.toggleAttribute("aria-current",b.dataset.tab===t));
  document.querySelector(`nav button[data-tab="${t}"]`).setAttribute("aria-current","page");
  if(t!=="duel")clearInterval(timerI);
  if(t==="market"){tickMarket();refreshMarket(false);}
  renderCurrent();
  if(t==="duel"&&D.phase==="battle"&&!D.res)startTimer();
  window.scrollTo({top:0});
}
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-tab]");if(nav){go(nav.dataset.tab);return;}
  const tg=e.target.closest("[data-tab-go]");if(tg){go(tg.dataset.tabGo);return;}
  const f=e.target.closest("[data-filter]");if(f){filter=f.dataset.filter;renderCollection();return;}
  const mk=e.target.closest("[data-mk]");if(mk){mkTab=mk.dataset.mk;renderMarket();return;}
  if(e.target.id==="modal"){closeSheet();if(tab==="collection")renderCollection();return;}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,id=a.dataset.id,lid=a.dataset.lid;
  switch(act){
    case "open":openPack(a.dataset.how);break;
    case "po-close":PO.close();break;
    case "po-again":PO.close();openPack("free");break;
    case "detail":armed=null;openDetail(id);break;
    case "quick":quickSell(id);break;
    case "bulk":bulkSell();break;
    case "sellform":sellForm(id);break;
    case "list":listCard(id);break;
    case "pick-sell":pickToSell();break;
    case "unlist":cancelListing(lid);break;
    case "buy":buyItem(lid);break;
    case "mk-view":viewListing(lid);break;
    case "mk-refresh":refreshMarket(true);break;
    case "vip-buy":vipBuy();break;
    case "vip-code":vipCode();break;
    case "reset":
      if(armed!=="reset"){armed="reset";renderCollection();return;}
      S=defaults();save();syncHeader();D={phase:"select",sel:[]};armed=null;toast("Nouvelle partie");go("boosters");break;
    case "toggle":{const p=D.sel.indexOf(id);if(p>-1)D.sel.splice(p,1);else if(D.sel.length<3)D.sel.push(id);else toast("3 cartes maximum");renderDuel();break;}
    case "start":if(D.sel.length===3)startDuel();break;
    case "answer":answer(+a.dataset.i);break;
    case "next":nextRound();break;
    case "again":D.sel=D.sel.filter(x=>S.cards[x]&&S.cards[x].count>0);if(D.sel.length===3)startDuel();else{D={phase:"select",sel:[]};renderDuel();}break;
    case "newsel":D={phase:"select",sel:[]};renderDuel();break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

/* ================= Horloge ================= */
setInterval(()=>{
  const before=S.packs;regen();
  if(S.packs!==before){syncHeader();if(tab==="boosters"&&!packBusy)renderBoosters();}
  if(tab==="boosters"){const t=$("#packTimer");if(t)t.textContent=S.packs>=CFG.MAX_PACKS?"Réserve pleine, ouvre tes paquets !":`Prochain paquet dans ${mmss(nextPackIn())}`;}
},1000);
setInterval(tickMarket,20000);

dayCheck();regen();tickMarket();syncHeader();renderBoosters();mostRead();
</script>
